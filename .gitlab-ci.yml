
stages:
  - build
  - test
  - deploy

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t my-api .
    - docker save my-api > my-api.tar
  artifacts:
    paths:
      - my-api.tar

test:
  stage: test
  image: python:3.9-slim-buster
  script:
    - pip install -r requirements.txt
    - pytest --cov=app tests/

deploy:
  stage: deploy
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker load < my-api.tar
    - docker-compose up -d
  only:
    - main