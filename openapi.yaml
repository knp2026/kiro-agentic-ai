openapi: 3.0.0
info:
  title: AI-Driven Banking Contract Retrieval with Human-in-the-Loop (HITL)
  version: 1.0.0
paths:
  /auth/authenticate:
    post:
      summary: Authenticate a customer and verify their identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthenticationRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationResponse'
components:
  schemas:
    AuthenticationRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    AuthenticationResponse:
      type: object
      properties:
        access_token:
          type: string